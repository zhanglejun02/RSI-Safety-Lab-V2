[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-echo-adapter"
version = "0.1.0"
description = "Independent executable-Harness adapter example for the RSI Safety Lab SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rsi-safety-lab>=0.5.0,<1"]

[project.entry-points."rsi_lab.methods"]
echo = "rsi_echo_adapter:PLUGIN"

[tool.setuptools.packages.find]
where = ["src"]
